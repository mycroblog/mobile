# The Android SDK packages that scripts/check/run.sh needs (CONTRIBUTING.md, in the x86_64 image of a Linux runner),
# and KVM for the emulator.
name: Set up the Android SDK
description: Install the SDK packages and the emulator image of the checks, and let the emulator use KVM
runs:
  using: composite
  steps:
    - name: Let the emulator use KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Install the SDK packages
      shell: bash
      run: |
        sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        # sdkmanager closes its input once every license is accepted, which ends yes with SIGPIPE: that is not a failure.
        # A license left unaccepted fails the install below.
        yes 2>/dev/null | "$sdkmanager" --licenses >/dev/null || true
        "$sdkmanager" "cmdline-tools;latest" "platforms;android-37.2" "build-tools;37.0.0" platform-tools emulator \
          "system-images;android-37.0;google_apis_playstore;x86_64" | grep -v '^\[' || true
        ls "$ANDROID_HOME/system-images/android-37.0/google_apis_playstore/x86_64" >/dev/null
