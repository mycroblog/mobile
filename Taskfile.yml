# The single entry point of every check (ADR-0006 §3): an agent, a contributor and CI run `task check`, which
# `scripts/kit check` also runs. Each area keeps its tasks in tasks/<area>.yml under its own namespace and has a
# `<area>:check`; a new area is one file there, one line under `includes`, and one line under `check`.
version: "3"

output: prefixed

includes:
  android: ./tasks/android.yml
  api: ./tasks/api.yml
  docs: ./tasks/docs.yml
  harness: ./tasks/harness.yml
  ios: ./tasks/ios.yml
  my: ./tasks/my.yml
  toolchain: ./tasks/toolchain.yml

tasks:
  check:
    desc: Run every check, each area in parallel, and report every area that fails; then launch each app on its devices, one after another
    failfast: false
    deps:
      - toolchain:check
      - docs:check
      - harness:check
      - api:check
      - ios:check
      - android:check
    # The launches run one after another, after every area has passed: only one simulator or emulator runs at a time.
    cmds:
      - task: ios:launch
      - task: android:launch
