# The single entry point of every check (ADR-0006 §3): `task check` runs every area, CI runs the tasks of each area,
# and `scripts/kit check` runs those of the areas a branch reaches (ADR-0012 §3). Each area keeps its tasks in tasks/<area>.yml under its own namespace and has a
# `<area>:check`; a new area is one file there, one line under `includes`, and one line under `check`.
version: "3"

output: prefixed

includes:
  android: ./tasks/android.yml
  api: ./tasks/api.yml
  docs: ./tasks/docs.yml
  harness: ./tasks/harness.yml
  ios: ./tasks/ios.yml
  my: ./tasks/my.yml
  toolchain: ./tasks/toolchain.yml

tasks:
  check:
    desc: Run every check of every area in parallel, and report every area that fails; then run the iOS tests on one simulator
    failfast: false
    deps:
      - toolchain:check
      - docs:check
      - harness:check
      - api:check
      - ios:check
      - android:check
      - android:test
    # The tests on a simulator run after every area has passed: one device at a time (ADR-0012 §2).
    cmds:
      - task: ios:test

  check:areas:
    desc: Run the checks named in TASKS (space-separated) in parallel, and report every one that fails; scripts/kit check names them
    failfast: false
    deps:
      - for: { var: TASKS }
        task: "{{.ITEM}}"

  check:devices:
    desc: Launch each app on every device kind, one device at a time; CI runs it, so not part of task check (ADR-0012 §3)
    cmds:
      - task: ios:launch
      - task: android:launch

  check:flow:
    desc: Run the UI-flow tests of every app, one device at a time; slower, so not part of task check
    cmds:
      - task: ios:test-flow
      - task: android:test-flow
