# The Android app (app/and): its build, with the module boundaries of ADR-0010 §6, its launch on emulators, and its
# client of the client API (ADR-0003 §2).
version: "3"

tasks:
  check:
    desc: Build the Android app and every module, failing on a dependency between modules that ADR-0010 §6 forbids
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh android-build

  launch:
    desc: Install and launch the Android app on a phone and then a tablet emulator, and confirm that it runs
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh android-launch

  api-generate:
    desc: Generate the Kotlin client from shared/api/openapi.yaml into app/and/core/api/src/generated (OUT, a new or empty directory, writes it there instead)
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh android-api-generate "{{.OUT}}"

  api-check:
    desc: Fail when the committed Kotlin client differs from what shared/api/openapi.yaml generates, naming task api:generate
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh android-api-check

  test:
    desc: Run the Android unit, screenshot and integration tests on the JVM, the last against the local my that my:up starts, and name the screenshots to open
    dir: "{{.ROOT_DIR}}"
    deps: [":my:up"]
    cmds:
      - scripts/check/run.sh android-test

  record-screenshots:
    desc: Record the reference images of the Android screenshot tests again, replacing the committed ones, and name them
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh android-record-screenshots

  test-flow:
    desc: Run the Android UI-flow tests on the phone emulator drive-phone, under the device lock
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh android-test-flow
