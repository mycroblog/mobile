# The Android app (app/and): its build, with the module boundaries of ADR-0010 §6, its format and lint, its layout by
# window size class (ADR-0010 §4), its launch on emulators, and its client of the client API (ADR-0003 §2).
version: "3"

tasks:
  check:
    desc: Build the Android app and every module, failing on a dependency between modules that ADR-0010 §6 forbids, on Kotlin that ktlint or Android Lint rejects, and on layout by device, orientation or screen (ADR-0010 §4)
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh android-build
      - scripts/check/run.sh android-lint
      - scripts/check/run.sh android-layout

  format:
    desc: Format the hand-written Kotlin of app/and with ktlint, as .editorconfig says
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh android-format

  launch:
    desc: Install and launch the Android app on a phone and then a tablet emulator, and confirm that it runs
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh android-launch

  api-generate:
    desc: Generate the Kotlin client from shared/api/openapi.yaml into app/and/core/api/src/generated (OUT, a new or empty directory, writes it there instead)
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh android-api-generate "{{.OUT}}"

  api-check:
    desc: Fail when the committed Kotlin client differs from what shared/api/openapi.yaml generates, naming task api:generate
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh android-api-check

  test:
    desc: Run the Android unit and integration tests on the JVM, the last against the local my that my:up starts
    dir: "{{.ROOT_DIR}}"
    deps: [":my:up"]
    cmds:
      - scripts/check/run.sh android-test

  test-flow:
    desc: Run the Android UI-flow tests on the phone emulator drive-phone, under the device seat
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh android-test-flow
