# The iOS app (app/ios): its generated project, the format of its Swift, the layout rule of ADR-0009 §1, its packages
# and their dependency direction (ADR-0009 §7), and the app on the iPhone and iPad simulators.
version: "3"

tasks:
  check:
    desc: Lint the Swift, refuse a layout by device or a dependency against the direction, build each package on its own, and build the app
    platforms: [darwin]
    failfast: false
    deps: [lint, layout, dependencies, imports, packages, build]

  lint:
    desc: Fail when the hand-written Swift is not formatted as .swift-format says (swift format lint), naming task ios:format
    platforms: [darwin]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-lint

  format:
    desc: Format the hand-written Swift in place with swift format and .swift-format, then lint what it cannot fix
    platforms: [darwin]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-format

  layout:
    desc: Refuse a layout by device idiom, orientation, screen or window size, or a fixed width in the app's Swift (ADR-0009 §1)
    platforms: [darwin]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-layout

  dependencies:
    desc: Refuse a declared package dependency against ADR-0009 §7 in Package.swift or project.yml, and a generated API type reachable outside the API package
    platforms: [darwin]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-dependencies

  generate:
    desc: Generate app/ios/Mycroblog.xcodeproj from app/ios/project.yml with XcodeGen
    platforms: [darwin]
    run: once
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-generate

  imports:
    desc: Refuse an import of a package that the importing target does not declare as its dependency
    platforms: [darwin]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-imports

  packages:
    desc: Build each package of app/ios/Packages on its own for the iOS Simulator, with only what it declares
    platforms: [darwin]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-packages

  build:
    desc: Build the app for the iOS Simulator
    platforms: [darwin]
    run: once
    deps: [generate]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-build

  api-generate:
    desc: Generate the Swift client from shared/api/openapi.yaml into app/ios/Packages/API/Sources/GeneratedAPI, or into the directory OUT
    platforms: [darwin]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-api-generate {{if .OUT}}"{{.OUT}}"{{end}}

  api-check:
    desc: Fail when the committed Swift client differs from what shared/api/openapi.yaml generates, naming task api:generate
    platforms: [darwin]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-api-check

  launch:
    desc: Launch the app on an iPhone and then an iPad simulator, confirm it runs, and shut each down (one device at a time on this Mac)
    platforms: [darwin]
    deps: [build]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-launch

  test:
    desc: Run the unit and integration tests on one iPhone simulator, against a local my (ADR-0006 §1)
    platforms: [darwin]
    deps: [":my:up"]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-test

  test-flow:
    desc: Run the UI-flow tests (XCUITest) on one iPhone simulator, against a local my (ADR-0006 §1)
    platforms: [darwin]
    deps: [generate, ":my:up"]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-test-flow
