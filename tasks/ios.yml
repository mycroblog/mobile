# The iOS app (app/ios): its generated project, its packages and their dependency direction (ADR-0009 §7), and the
# app on the iPhone and iPad simulators.
version: "3"

tasks:
  check:
    desc: Refuse an import against the dependency direction, build each package on its own, and build the app
    platforms: [darwin]
    failfast: false
    deps: [imports, packages, build]

  generate:
    desc: Generate app/ios/Mycroblog.xcodeproj from app/ios/project.yml with XcodeGen
    platforms: [darwin]
    run: once
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-generate

  imports:
    desc: Refuse an import of a package that the importing target does not declare as its dependency
    platforms: [darwin]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-imports

  packages:
    desc: Build each package of app/ios/Packages on its own for the iOS Simulator, with only what it declares
    platforms: [darwin]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-packages

  build:
    desc: Build the app for the iOS Simulator
    platforms: [darwin]
    run: once
    deps: [generate]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-build

  api-generate:
    desc: Generate the Swift client from shared/api/openapi.yaml into app/ios/Packages/API/Sources/GeneratedAPI, or into the directory OUT
    platforms: [darwin]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-api-generate {{if .OUT}}"{{.OUT}}"{{end}}

  api-check:
    desc: Fail when the committed Swift client differs from what shared/api/openapi.yaml generates, naming task api:generate
    platforms: [darwin]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-api-check

  launch:
    desc: Launch the app on an iPhone and then an iPad simulator, confirm it runs, and shut each down (one device at a time on this Mac)
    platforms: [darwin]
    deps: [build]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-launch

  test:
    desc: Run the unit, screenshot and integration tests on one iPhone simulator, against a local my (ADR-0006 §1), naming the images to open
    platforms: [darwin]
    deps: [":my:up"]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-test

  record-screenshots:
    desc: Record every reference image of the screenshot tests again, on the simulator the tests use; commit what changes
    platforms: [darwin]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-record-screenshots

  test-flow:
    desc: Run the UI-flow tests (XCUITest) on one iPhone simulator
    platforms: [darwin]
    deps: [generate]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - scripts/check/run.sh ios-test-flow
